plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.rachidbijigune.scannova'
version = '0.1.0'

android {
  namespace "expo.modules.scannovascanner"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
}
